name: Fork release

on:
  push:
    tags:
      - "fork-v*"

permissions:
  contents: write

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 45
    steps:
      - name: Require green CI jobs on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          # Integration Tests are left out until they pass on the fork again;
          # add them back here once they do.
          REQUIRED_JOBS: "ci - ubuntu-latest,ci - windows-latest,build,check-codebase,lint"
        run: |
          # Only publish commits whose push-to-master CI passed. CI starts on
          # the same push as the tag, so wait for it to finish first.
          for _ in $(seq 1 40); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --limit 1 \
              --json databaseId,status,url --jq '.[0] // empty')
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
              echo "ci.yml run: $(jq -r .url <<<"$run")"
              jobs=$(gh run view "$(jq -r .databaseId <<<"$run")" --repo "$GITHUB_REPOSITORY" \
                --json jobs --jq '.jobs[] | "\(.name)\t\(.conclusion)"')
              failed=0
              IFS=, read -ra required <<<"$REQUIRED_JOBS"
              for job in "${required[@]}"; do
                conclusion=$(awk -F'\t' -v j="$job" '$1 == j { print $2 }' <<<"$jobs")
                echo "$job: ${conclusion:-missing}"
                [ "$conclusion" = success ] || failed=1
              done
              [ "$failed" = 0 ] || {
                echo "error: required CI jobs did not pass on $GITHUB_SHA"
                exit 1
              }
              exit 0
            fi
            sleep 60
          done
          echo "error: no completed ci.yml push run for $GITHUB_SHA after 40 minutes"
          exit 1

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      windows_asset_url: ${{ steps.version.outputs.windows_asset_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # Trigger tags are namespaced "fork-v*" so they can never collide
          # with upstream's own "v*" tags on this repo's other remote (see
          # docs/adr/0001-fork-release-tag-prefix.md). Strip the "fork-"
          # prefix to get a clean "vX.Y.Z" that goreleaser (and GitHub's
          # release UI) expect.
          TAG="${GITHUB_REF_NAME#fork-}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "windows_asset_url=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/lazygit_${VERSION}_windows_x86_64.zip" >> "$GITHUB_OUTPUT"

          # goreleaser requires GORELEASER_CURRENT_TAG (set below) to name a
          # real git tag at HEAD, not just a string override. Create it
          # locally — no need to push it, GitHub auto-creates the tag ref
          # when goreleaser creates the release under this name.
          git tag "$TAG"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publish under the clean "vX.Y.Z" tag instead of the pushed
          # "fork-vX.Y.Z" trigger tag; see the "Determine version" step above.
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}

  winget:
    needs: release
    runs-on: windows-latest
    # Until khanhtd36.lazygit-khanhtd36 exists in winget-pkgs (bootstrapped
    # once via `wingetcreate new`), `update` below has nothing to update and
    # fails — that must not fail the release itself.
    continue-on-error: true
    steps:
      - name: Install wingetcreate
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit winget manifest update
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          .\wingetcreate.exe update khanhtd36.lazygit-khanhtd36 `
            --version "${{ needs.release.outputs.version }}" `
            --urls "${{ needs.release.outputs.windows_asset_url }}" `
            --submit `
            --token "$env:WINGET_TOKEN"

  homebrew:
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: khanhtd36/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          # The formula pins one sha256 per macOS arch, so both archives
          # need fetching even though a given runner only tests one.
          arm64_url="https://github.com/khanhtd36/lazygit/releases/download/${TAG}/lazygit_${VERSION}_darwin_arm64.tar.gz"
          amd64_url="https://github.com/khanhtd36/lazygit/releases/download/${TAG}/lazygit_${VERSION}_darwin_x86_64.tar.gz"
          arm64_sha=$(curl -sL "$arm64_url" | shasum -a 256 | cut -d' ' -f1)
          amd64_sha=$(curl -sL "$amd64_url" | shasum -a 256 | cut -d' ' -f1)

          formula=Formula/lazygit-khanhtd36.rb
          sed -i '' \
            -e "s|version \".*\"|version \"${VERSION}\"|" \
            -e "s|releases/download/v[^/]*/lazygit_[^_]*_darwin_arm64\.tar\.gz|releases/download/${TAG}/lazygit_${VERSION}_darwin_arm64.tar.gz|" \
            -e "s|releases/download/v[^/]*/lazygit_[^_]*_darwin_x86_64\.tar\.gz|releases/download/${TAG}/lazygit_${VERSION}_darwin_x86_64.tar.gz|" \
            "$formula"
          # Replace the sha256 that follows each url line, matched by
          # arch-specific context since the two shas would otherwise be
          # indistinguishable to a blind substitution.
          awk -v arm="$arm64_sha" -v amd="$amd64_sha" '
            /darwin_arm64/ { arch = "arm" }
            /darwin_x86_64/ { arch = "amd" }
            /sha256/ && arch == "arm" { sub(/sha256 ".*"/, "sha256 \"" arm "\""); arch = "" }
            /sha256/ && arch == "amd" { sub(/sha256 ".*"/, "sha256 \"" amd "\""); arch = "" }
            { print }
          ' "$formula" > "$formula.tmp"
          mv "$formula.tmp" "$formula"

      - name: Commit and push
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git -c user.name="khanhtd36-bot" -c user.email="khanhtd36@gmail.com" \
            commit -am "Update lazygit-khanhtd36 to ${VERSION}"
          git push
